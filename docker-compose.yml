services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: catalogforge
      POSTGRES_PASSWORD: catalogforge
      POSTGRES_DB: catalogforge
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    command: ["postgres", "-c", "max_connections=200", "-c", "shared_buffers=256MB"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalogforge"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
